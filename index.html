<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoForm AI - Demo</title>
<style>
    body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #0d0d1a;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    h1 {
        margin-top: 30px;
        color: #0ff;
        text-shadow: 0 0 10px #0ff;
    }
    .container {
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 300px;
    }
    input {
        padding: 10px;
        border-radius: 5px;
        border: none;
        outline: none;
    }
    button {
        padding: 10px;
        border: none;
        border-radius: 5px;
        background: #0ff;
        color: #000;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
    }
    button:hover {
        background: #0aa;
        color: #fff;
    }
    #profileContainer {
        margin-top: 20px;
        display: grid;
        gap: 15px;
        width: 80%;
    }
    .profile-card {
        background: #1e1e2f;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 0 10px #0ff;
    }
</style>
</head>
<body>

<h1>AutoForm AI - Demo</h1>

<div class="container">
    <h2>Registrieren</h2>
    <input type="email" id="regEmail" placeholder="E-Mail">
    <input type="password" id="regPassword" placeholder="Passwort">
    <button id="registerBtn">Registrieren</button>

    <h2>Login</h2>
    <input type="email" id="loginEmail" placeholder="E-Mail">
    <input type="password" id="loginPassword" placeholder="Passwort">
    <button id="loginBtn">Login</button>

    <button id="loadProfilesBtn">Profile laden</button>
</div>

<div id="profileContainer"></div>

<script>
const backendUrl = "https://autoform-backend.onrender.com"; // dein Render Backend
let token = "";

document.getElementById("registerBtn").addEventListener("click", async () => {
    const email = document.getElementById("regEmail").value;
    const password = document.getElementById("regPassword").value;

    const res = await fetch(`${backendUrl}/api/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
    });

    if(res.ok) {
        const data = await res.json();
        token = data.token;
        alert("Registrierung erfolgreich! Token gesetzt.");
    } else {
        alert("Registrierung fehlgeschlagen!");
    }
});

document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    const res = await fetch(`${backendUrl}/api/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
    });

    if(res.ok) {
        const data = await res.json();
        token = data.token;
        alert("Login erfolgreich! Token gesetzt.");
    } else {
        alert("Login fehlgeschlagen!");
    }
});

document.getElementById("loadProfilesBtn").addEventListener("click", async () => {
    if(!token) {
        alert("Bitte zuerst einloggen!");
        return;
    }

    const res = await fetch(`${backendUrl}/api/profiles`, {
        headers: { "Authorization": `Bearer ${token}` }
    });

    if(res.ok) {
        const profiles = await res.json();
        const container = document.getElementById("profileContainer");
        container.innerHTML = "";

        profiles.forEach(profile => {
            const div = document.createElement("div");
            div.classList.add("profile-card");
            div.innerHTML = `
                <h3>${profile.name}</h3>
                <p>Email: ${profile.email}</p>
                <p>Telefon: ${profile.phone}</p>
                <p>Adresse: ${profile.address}</p>
            `;
            container.appendChild(div);
        });
    } else {
        alert("Fehler beim Laden der Profile!");
    }
});
</script>

</body>
</html>
