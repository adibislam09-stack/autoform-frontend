<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>AutoForm AI - Demo</title>
<style>
  body { background-color: #111; color: #0ff; font-family: "Arial", sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .container { background-color: #222; padding: 20px; border-radius: 10px; width: 400px; box-shadow: 0 0 20px #0ff; }
  input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: none; }
  button { width: 100%; padding: 10px; margin-top: 10px; background-color: #0ff; color: #111; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
  button:hover { background-color: #0cc; }
  .profile { background-color: #111; padding: 10px; margin-top: 10px; border-radius: 5px; }
</style>
</head>
<body>
<div class="container">
  <h2>AutoForm AI - Demo</h2>

  <h3>Registrieren</h3>
  <input id="regName" placeholder="Name">
  <input id="regEmail" placeholder="Email">
  <input id="regPassword" type="password" placeholder="Passwort">
  <button onclick="register()">Registrieren</button>
  <p id="regMsg"></p>

  <h3>Login</h3>
  <input id="loginEmail" placeholder="Email">
  <input id="loginPassword" type="password" placeholder="Passwort">
  <button onclick="login()">Login</button>
  <p id="loginMsg"></p>

  <h3>Profile laden</h3>
  <button onclick="loadProfiles()">Profile laden</button>
  <div id="profiles"></div>
</div>

<script>
const backendUrl = "http://localhost:4000"; // Bei Render: z.B. https://dein-backend.onrender.com
let token = null;

function register() {
  const name = document.getElementById("regName").value;
  const email = document.getElementById("regEmail").value;
  const password = document.getElementById("regPassword").value;

  fetch(`${backendUrl}/api/register`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, email, password })
  }).then(res => res.json())
    .then(data => {
      if (data.token) token = data.token;
      document.getElementById("regMsg").innerText = data.message || data.error;
    });
}

function login() {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  fetch(`${backendUrl}/api/login`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  }).then(res => res.json())
    .then(data => {
      if (data.token) token = data.token;
      document.getElementById("loginMsg").innerText = data.message || data.error;
    });
}

function loadProfiles() {
  if (!token) { alert("Bitte zuerst einloggen!"); return; }

  fetch(`${backendUrl}/api/profiles`, {
    headers: { "Authorization": "Bearer " + token }
  }).then(res => res.json())
    .then(profiles => {
      const container = document.getElementById("profiles");
      container.innerHTML = "";
      profiles.forEach(p => {
        container.innerHTML += `<div class="profile">
          <strong>${p.name}</strong><br>
          Email: ${p.email}
        </div>`;
      });
    });
}
</script>
</body>
</html>
